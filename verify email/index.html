<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OTP Verification</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Icons -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

  <div class="container">

    <!-- BACK -->
    <div class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
      <a href="#">Back to Signup</a>
    </div>

    <!-- LOGO -->
    <div class="logo">
  <img src="images/logo.png" alt="Logo">
</div>
    <!-- TITLE -->
    <div class="title">
      <h2>Verify Email</h2>
      <p>Enter the 6-digit code sent to your email</p>
    </div>

    <!-- EMAIL -->
    <div class="email-box">
      <input type="email" id="email" placeholder="Enter your Gmail">
    </div>

    <!-- SEND OTP -->
    <button class="send-btn" id="sendOtpBtn">
      Send OTP
    </button>

    <!-- OTP BOX -->
    <div class="otp-container">

      <input type="text" maxlength="1" class="otp-input">
      <input type="text" maxlength="1" class="otp-input">
      <input type="text" maxlength="1" class="otp-input">
      <input type="text" maxlength="1" class="otp-input">
      <input type="text" maxlength="1" class="otp-input">
      <input type="text" maxlength="1" class="otp-input">

    </div>

    <!-- VERIFY -->
    <button class="verify-btn" id="verifyBtn">
      Verify OTP
    </button>

    <!-- TIMER -->
    <p class="timer" id="timerText">
      Resend OTP in 60s
    </p>

    <!-- RESEND -->
    <button class="resend-btn" id="resendBtn">
      Resend OTP >
    </button>

  </div>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
